name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to build and publish
        required: true
        default: "1.0.6"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build modules
        run: ./gradlew clean :api:jar :core:jar :folia:jar -x test --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            api/build/libs/api-*.jar
            core/build/libs/core-*.jar
            folia/build/libs/folia-*.jar
          body: |
            Faster repeated menu rendering with bounded text reuse and visible-page item building.

            - Repeated mixed-format text translations reuse immutable components
            - Paged menus can build only the visible database-backed entry window

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: ./gradlew :api:publishMavenPublicationToGitHubPackagesRepository :core:publishMavenPublicationToGitHubPackagesRepository :folia:publishMavenPublicationToGitHubPackagesRepository -x test --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
