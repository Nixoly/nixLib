name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to build and publish
        required: true
        default: "1.1.0"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build modules
        run: ./gradlew clean :api:jar :core:jar :folia:jar -x test --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            api/build/libs/api-*.jar
            core/build/libs/core-*.jar
            folia/build/libs/folia-*.jar
          body: |
            Menus stay in sync with the client after they close, spam clicking costs the server almost nothing, and the database layer covers more databases under the plugin's own name.

            - Opening or closing a menu from a click handler waits for the next tick, and the player's inventory is resent once a menu closes
            - One handled click per 150 ms per player; a double click no longer runs a button twice
            - Menu listeners no longer copy block states on every chest click, and player heads no longer block on Mojang lookups
            - New database builder for SQLite, H2, MySQL, MariaDB, PostgreSQL and SQL Server, also readable from config.yml
            - Transactions, batches, generated keys and upserts on every database
            - Pool and worker names come from the plugin, so the console no longer shows nixlib-sqlite
            - Colour, sound and statistics helpers do less work per call

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: ./gradlew :api:publishMavenPublicationToGitHubPackagesRepository :core:publishMavenPublicationToGitHubPackagesRepository :folia:publishMavenPublicationToGitHubPackagesRepository -x test --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
